services:
  x056:
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      - dind
    ports:
      # Loopback-only: reachable at localhost:4056 (what nginx proxies to) but
      # NOT on the host's public IP — the domain (behind nginx/TLS) is the only
      # intended entry point, not http://<host-ip>:4056 directly.
      - "127.0.0.1:4056:4056"
    environment:
      X056_TOKEN: ${X056_TOKEN:?generate one into .env — openssl rand -hex 32}
      X056_WORKSPACE_ROOT: /home/efran/remote-development
      X056_STATE_DIR: /app/state
      # Serve the panel from the bind-mounted repo: UI changes appear on
      # refresh, no rebuild needed.
      X056_PANEL_PATH: /home/efran/remote-development/x056-remote-control/server/public/panel.html
      PORT: "4056"
      # WebAuthn/passkey relying-party id(s), comma-separated — the public host(s)
      # passkeys are bound to (localhost is always allowed for dev/e2e). Origin is
      # derived per-request and validated against this.
      X056_RP_ID: x056.rc.val.id
      # A project session that runs `docker`/`docker compose` (builds, e2e stacks)
      # is pointed at the ISOLATED dind daemon below — NOT the host's Docker. The
      # host daemon is never exposed to sessions. See CLAUDE.md.
      DOCKER_HOST: tcp://dind:2375
    volumes:
      - /home/efran/.claude-x056-a:/home/efran/.claude-x056-a
      - /home/efran/.claude-x056-b:/home/efran/.claude-x056-b
      - /home/efran/remote-development:/home/efran/remote-development
      # Read-only: lets the gateway list + import existing interactive sessions
      # to resume them. Transcripts only — credentials live outside projects/.
      - /home/efran/.claude/projects:/home/efran/.claude/projects:ro
      - x056-state:/app/state
  # Isolated Docker-in-Docker daemon for PROJECTS' own docker needs (building
  # images, spinning up compose e2e stacks). It is privileged, but it is a NESTED
  # daemon — it cannot see or touch the host's Docker. The workspace is mounted at
  # the SAME absolute path as in x056 so a project's relative bind mounts (e.g.
  # `./uploads`) resolve to real paths the daemon can find. Not published to the
  # host: reachable only on the internal compose network, over plain tcp 2375.
  dind:
    image: docker:27-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - dind-storage:/var/lib/docker
      - /home/efran/remote-development:/home/efran/remote-development
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  x056-state:
  dind-storage:

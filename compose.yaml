services:
  x056:
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      - dind
    ports:
      # Loopback-only: reachable at localhost:4056 (what nginx proxies to) but
      # NOT on the host's public IP — the domain (behind nginx/TLS) is the only
      # intended entry point, not http://<host-ip>:4056 directly.
      - "127.0.0.1:4056:4056"
    environment:
      # All settings come from .env (see .env.example). Defaults are the author's
      # deployment so nothing breaks if a var is unset; override in your .env.
      X056_TOKEN: ${X056_TOKEN:?generate one into .env — openssl rand -hex 32}
      X056_WORKSPACE_ROOT: ${X056_WORKSPACE_ROOT:-/home/efran/remote-development}
      X056_STATE_DIR: /app/state
      # Panel HTML is bind-mount live-served (UI edits appear on refresh, no rebuild).
      X056_PANEL_PATH: ${X056_PANEL_PATH:-/home/efran/remote-development/x056-remote-control/server/public/panel.html}
      PORT: "4056"
      # WebAuthn/passkey relying-party id(s), comma-separated — the public host(s)
      # passkeys are bound to (localhost is always allowed for dev/e2e).
      X056_RP_ID: ${X056_RP_ID:-x056.rc.val.id}
      # Optional host-specific addendum appended to the per-session system note
      # (SSH escape hatches, self-serve nginx, extra git remotes …). Unset by
      # default — the shared note stays generic. Set it in your .env if you want
      # your sessions taught about your host's extras.
      X056_HOST_NOTE: ${X056_HOST_NOTE:-}
      # Optional: bootstrap >2 accounts at init (comma-separated config dirs,
      # named a, b, c …). Blank → the A/B pair below. More can be onboarded from
      # the panel at any time (stored in the state volume).
      X056_ACCOUNT_DIRS: ${X056_ACCOUNT_DIRS:-}
      X056_ACCOUNT_A_DIR: ${X056_ACCOUNT_A_DIR:-/home/efran/.claude-x056-a}
      X056_ACCOUNT_B_DIR: ${X056_ACCOUNT_B_DIR:-/home/efran/.claude-x056-b}
      # Project sessions' `docker`/`docker compose` point at the ISOLATED dind
      # sidecar below — NOT the host's Docker.
      DOCKER_HOST: tcp://dind:2375
    volumes:
      # The two Claude account config dirs (each a separate `claude /login`).
      - ${X056_ACCOUNT_A_DIR:-/home/efran/.claude-x056-a}:${X056_ACCOUNT_A_DIR:-/home/efran/.claude-x056-a}
      - ${X056_ACCOUNT_B_DIR:-/home/efran/.claude-x056-b}:${X056_ACCOUNT_B_DIR:-/home/efran/.claude-x056-b}
      # The workspace of repos the panel can open as projects.
      - ${X056_WORKSPACE_ROOT:-/home/efran/remote-development}:${X056_WORKSPACE_ROOT:-/home/efran/remote-development}
      # Read-only: import existing interactive `claude` sessions for resume.
      - ${X056_INTERACTIVE_PROJECTS:-/home/efran/.claude/projects}:${X056_INTERACTIVE_PROJECTS:-/home/efran/.claude/projects}:ro
      - x056-state:/app/state
  # Isolated Docker-in-Docker daemon for PROJECTS' own docker needs (building
  # images, spinning up compose e2e stacks). It is privileged, but it is a NESTED
  # daemon — it cannot see or touch the host's Docker. The workspace is mounted at
  # the SAME absolute path as in x056 so a project's relative bind mounts (e.g.
  # `./uploads`) resolve to real paths the daemon can find. Not published to the
  # host: reachable only on the internal compose network, over plain tcp 2375.
  dind:
    image: docker:27-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - dind-storage:/var/lib/docker
      - ${X056_WORKSPACE_ROOT:-/home/efran/remote-development}:${X056_WORKSPACE_ROOT:-/home/efran/remote-development}
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  x056-state:
  dind-storage:

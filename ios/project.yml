name: X056
options:
  bundleIdPrefix: id.val
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: Z4NCYN9LKJ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  X056:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - X056Tests
        - X056UITests
    sources:
      - path: X056
      - path: Shared
    dependencies:
      - target: X056Widgets
        embed: true
      - target: X056Notifications
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.val.x056
        PRODUCT_NAME: X056
        INFOPLIST_FILE: X056/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: X056/Support/X056.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: X056/Support/Info.plist
      properties:
        CFBundleDisplayName: x056
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: Attach screenshots and photos to a message.
        NSMicrophoneUsageDescription: Speak to the Bot instead of typing.
        NSSpeechRecognitionUsageDescription: Turn what you say to the Bot into text, on this iPhone when it can.
        # A running turn on the Lock Screen (X056Widgets, Shared/TurnActivity.swift).
        NSSupportsLiveActivities: true
        # x056://conversation?projectId=…&sessionId=… (a Live Activity's tap).
        CFBundleURLTypes:
          - CFBundleURLName: id.val.x056
            CFBundleURLSchemes: [x056]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # A Bot push is shown as a message from the Bot, with its face
        # (X056Notifications); iOS asks the app to declare the intent.
        NSUserActivityTypes:
          - INSendMessageIntent
    entitlements:
      path: X056/Support/X056.entitlements
      properties:
        aps-environment: development
        # Passkeys for the gateway's host; it lists this app in
        # /.well-known/apple-app-site-association (server/apple-app-site.ts).
        com.apple.developer.associated-domains:
          - webcredentials:x056.rc.val.id
        # Lets a push carry a sender picture: the Bot's (X056Notifications).
        com.apple.developer.usernotifications.communication: true
  X056Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: X056Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.val.x056.widgets
        PRODUCT_NAME: X056Widgets
        INFOPLIST_FILE: X056Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
    info:
      path: X056Widgets/Info.plist
      properties:
        CFBundleDisplayName: x056
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  X056Notifications:
    type: app-extension
    platform: iOS
    sources:
      - path: X056Notifications
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.val.x056.notifications
        PRODUCT_NAME: X056Notifications
        INFOPLIST_FILE: X056Notifications/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
    info:
      path: X056Notifications/Info.plist
      properties:
        CFBundleDisplayName: x056
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
          NSExtensionAttributes:
            IntentsSupported:
              - INSendMessageIntent
  X056Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: X056Tests
    dependencies:
      - target: X056
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.val.x056.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/X056.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/X056
        BUNDLE_LOADER: $(TEST_HOST)
  X056UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: X056UITests
    dependencies:
      - target: X056
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.val.x056.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: X056

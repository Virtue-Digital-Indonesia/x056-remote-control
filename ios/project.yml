name: X056
options:
  bundleIdPrefix: id.val
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: Z4NCYN9LKJ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  X056:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - X056Tests
        - X056UITests
    sources:
      - path: X056
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.val.x056
        PRODUCT_NAME: X056
        INFOPLIST_FILE: X056/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: X056/Support/X056.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: X056/Support/Info.plist
      properties:
        CFBundleDisplayName: x056
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: Attach screenshots and photos to a message.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: X056/Support/X056.entitlements
      properties:
        aps-environment: development
  X056Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: X056Tests
    dependencies:
      - target: X056
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.val.x056.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/X056.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/X056
        BUNDLE_LOADER: $(TEST_HOST)
  X056UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: X056UITests
    dependencies:
      - target: X056
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.val.x056.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: X056

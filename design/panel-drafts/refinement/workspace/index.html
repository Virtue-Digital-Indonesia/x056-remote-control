<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>x056 · Workspace build review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#242424;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1400px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;gap:24px;align-items:center}h1{font-size:26px;letter-spacing:-.6px;margin:0}p{font-size:13px;color:#737373;max-width:660px;margin:8px 0 20px}.badge{font-size:11px;padding:5px 10px;border:1px solid #ddd;border-radius:20px;white-space:nowrap}nav{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 12px}button{border:0;background:none;border-radius:8px;padding:10px 14px;color:#777;font:inherit;font-size:13px;cursor:pointer}button[aria-pressed=true]{background:#242424;color:white}#variants{display:flex;gap:8px;margin:12px 0 18px}#variants button{padding:6px 10px;font-size:12px}#variants button[aria-pressed=true]{background:#eaeaea;color:#222}figure{margin:0}img{display:block;width:100%;border:1px solid #e5e5e5;border-radius:14px;box-shadow:0 10px 40px #00000008}img.mobile{max-width:390px;margin:auto}figcaption{font-size:12px;color:#737373;margin:12px 0}footer{padding:25px 0;font-size:12px;color:#737373}a{color:inherit;text-underline-offset:3px}@media(max-width:650px){main{padding:24px 14px}header{display:block}.badge{display:inline-block;margin-top:12px}h1{font-size:24px}button{padding:8px 10px}}</style>
<main><header><h1>Workspace build review</h1><span class="badge">Staged · Not deployed</span></header><p>Actual build screenshots using fixture data. Review agent activity, parallel conversations, project costs, question forms, and Codex commands.</p><nav id="screens" aria-label="Screen"></nav><div id="variants" role="group" aria-label="Appearance"></div><figure><a id="full" target="_blank" rel="noopener"><img id="preview"></a><figcaption id="caption"></figcaption></figure><footer><a href="../build/">Accounts and settings build</a> · <a href="/x056-workspace-ui-release-20260907.md">Release notes</a></footer></main>
<script>
const screens=[
 {name:'Agents',text:'85 agents, with search, status filters, usage summaries, and 30 rows per page.',views:[['Light','agent-list.png'],['Dark','agent-list-dark.png'],['Mobile','agents-mobile.png']]},
 {name:'Agent reader',text:'Conversation, brief, and result tabs. Load earlier messages or follow live output.',views:[['Desktop','agent-reader.png'],['Mobile','reader-mobile.png']]},
 {name:'Running work',text:'43 other conversations occupy one line. Open the list to find a conversation by project or title.',views:[['Compact indicator','running-summary.png'],['Grouped list','running-list.png']]},
 {name:'Project costs',text:'Recorded token usage at standard API rates, with project, conversation, and agent totals.',views:[['Breakdown','project-costs.png']]},
 {name:'Questions',text:'Four questions and five choices in this example. Answers survive reloads and failed sends.',views:[['Desktop','question-batch.png'],['Mobile','questions-mobile.png']]},
 {name:'Codex commands',text:'A discoverable command menu beside the composer. Native compact, review, and project skill dispatch.',views:[['Commands','codex-commands.png']]}
];let selected=0,variant=0;
function render(){document.getElementById('screens').replaceChildren(...screens.map((s,i)=>{const b=document.createElement('button');b.textContent=s.name;b.setAttribute('aria-pressed',i===selected);b.onclick=()=>{selected=i;variant=0;render();};return b;}));const s=screens[selected];document.getElementById('variants').replaceChildren(...s.views.map((v,i)=>{const b=document.createElement('button');b.textContent=v[0];b.setAttribute('aria-pressed',i===variant);b.onclick=()=>{variant=i;render();};return b;}));const view=s.views[variant],img=document.getElementById('preview');img.src=view[1];img.alt=s.text;img.className=view[0]==='Mobile'?'mobile':'';document.getElementById('full').href=view[1];document.getElementById('caption').textContent=s.text;}
render();
</script></html>

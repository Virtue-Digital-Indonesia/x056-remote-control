<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>x056 remote control</title>
<style>
  :root {
    color-scheme: light;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, monospace;
    --bg: #ffffff; --sidebar: #f7f7f5; --surface-2: #f0f0ee; --surface-3: #e8e8e5;
    --border: #e6e6e2; --border-strong: #d4d4ce;
    --text: #1a1a17; --muted: #73736c; --faint: #9a9a92;
    --accent: #c96442; --accent-weak: #f6ece7; --on-accent: #ffffff;
    --link: #2563eb;
    --user-bg: #f2f2ef;
    --ok: #15803d; --ok-bg: #dcf5e3; --amber: #b45309; --amber-bg: #fbecd0; --err: #b91c1c; --err-bg: #fbe0e0;
    --shadow: 0 12px 32px rgba(20,20,20,.14);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1a1a19; --sidebar: #141413; --surface-2: #26262400; --surface-3: #2f2f2c;
    --border: #2c2c2a; --border-strong: #3c3c39;
    --text: #ecece7; --muted: #a0a099; --faint: #6f6f68;
    --accent: #d97757; --accent-weak: #2a1f1a; --on-accent: #1a1a19;
    --link: #8fb8ff;
    --user-bg: #262624;
    --ok: #4ade80; --ok-bg: #123021; --amber: #fbbf24; --amber-bg: #2c2410; --err: #f87171; --err-bg: #2b1414;
    --shadow: 0 14px 40px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  .ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; display: inline-block; vertical-align: middle; }
  .ic.sm { width: 15px; height: 15px; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14.5px; line-height: 1.55; display: grid; grid-template-columns: 264px 1fr; height: 100vh; overflow: hidden; }

  /* sidebar */
  aside { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 15px 16px 12px; font-weight: 600; }
  .brand .mark { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; }
  .brand .sub { font-size: 11px; color: var(--faint); font-weight: 500; border: 1px solid var(--border-strong); border-radius: 20px; padding: 1px 7px; }
  .newbtn { margin: 4px 12px 10px; display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); cursor: pointer; font: inherit; font-size: 13.5px; font-weight: 500; }
  .newbtn:hover { background: var(--surface-2); }
  .side-scroll { flex: 1; overflow-y: auto; padding: 0 8px; min-height: 0; }
  .side-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 8px 6px; }
  .side-head span { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); font-weight: 600; }
  .side-head button { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px; border-radius: 6px; }
  .side-head button:hover { background: var(--surface-2); color: var(--text); }
  .proj { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--text); }
  .proj:hover { background: var(--surface-2); }
  .proj.active { background: var(--surface-3); font-weight: 600; }
  .proj .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .proj.active .dot { background: var(--accent); }
  .proj .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
  .proj .rspin { width: 12px; height: 12px; flex: none; display: none; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: spin .7s linear infinite; }
  .proj.busy .rspin { display: block; }
  .proj.busy .dot { background: var(--accent); }
  .proj .projrm { width: 18px; height: 18px; flex: none; display: none; align-items: center; justify-content: center; border: none; background: transparent; color: var(--faint); border-radius: 5px; cursor: pointer; padding: 0; }
  .proj:hover .projrm { display: inline-flex; }
  .proj.busy .projrm { display: none !important; }
  .proj .projrm:hover { background: var(--surface-2); color: var(--text); }
  .acct { margin: 8px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .acct:hover { background: var(--surface-2); }
  .acct .av { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  .acct .who { flex: 1; overflow: hidden; }
  .acct .who .n { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct .who .p { font-size: 11px; color: var(--faint); }

  /* main */
  main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-bottom: 1px solid var(--border); flex: none; }
  .topbar .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .cwd { font-size: 11.5px; color: var(--faint); background: var(--surface-2); border-radius: 6px; padding: 2px 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%; }
  .topbar .sp { flex: 1; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  #dot.on { background: var(--ok); } #dot.off { background: var(--err); }
  .ico { background: none; border: 1px solid transparent; border-radius: 8px; height: 32px; min-width: 32px; padding: 0 8px; cursor: pointer; color: var(--muted); font-size: 14px; }
  .ico:hover { background: var(--surface-2); color: var(--text); }

  .scroll { flex: 1; overflow-y: auto; min-height: 0; }
  .thread { max-width: 780px; margin: 0 auto; padding: 26px 24px 40px; }
  .msg { margin-bottom: 22px; }
  .msg .role { font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--faint); margin-bottom: 5px; }
  .msg.user { display: flex; flex-direction: column; align-items: flex-end; }
  .msg.user .content { background: var(--user-bg); border-radius: 14px 14px 4px 14px; padding: 10px 15px; max-width: 82%; white-space: pre-wrap; word-break: break-word; }
  .msg.assistant .content { word-break: break-word; }
  .content img.att { max-width: 280px; border-radius: 10px; border: 1px solid var(--border); margin-top: 8px; display: block; }

  .content p { margin: 0 0 11px; white-space: pre-wrap; }
  .content > *:last-child { margin-bottom: 0; }
  .content pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; overflow-x: auto; margin: 0 0 11px; }
  .content pre code { background: none; padding: 0; font: 12.5px/1.55 var(--mono); }
  .content code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; font: 12.5px/1.4 var(--mono); }
  .content ul, .content ol { margin: 0 0 11px; padding-left: 24px; }
  .content li { margin: 3px 0; }
  .content h3, .content h4, .content h5 { margin: 16px 0 9px; line-height: 1.3; }
  .content h3 { font-size: 18px; } .content h4 { font-size: 15.5px; } .content h5 { font-size: 14px; }
  .content a { color: var(--link); }
  .content hr { border: none; border-top: 1px solid var(--border); margin: 15px 0; }
  .content blockquote { margin: 0 0 11px; padding: 4px 14px; border-left: 3px solid var(--border-strong); color: var(--muted); }
  .content table { border-collapse: collapse; margin: 0 0 11px; font-size: 13px; display: block; overflow-x: auto; max-width: 100%; }
  .content th, .content td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; vertical-align: top; }
  .content th { background: var(--surface-2); font-weight: 600; }
  .cachenote span { color: var(--accent); background: var(--accent-weak); }
  #autopilotBar { max-width: 780px; margin: 0 auto 8px; }
  #autopilotBar:empty { display: none; }
  .apbar { display: flex; align-items: center; gap: 10px; background: var(--accent-weak); border: 1px solid var(--accent); border-radius: 12px; padding: 8px 14px; font-size: 13px; color: var(--accent); }
  .apbar .lbl { flex: 1; }
  .apbar button { background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 4px 12px; cursor: pointer; font: inherit; font-size: 12px; }
  #otherRuns { max-width: 780px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .orun { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; cursor: pointer; max-width: 100%; }
  .orun:hover { border-color: var(--border-strong); color: var(--text); }
  .orun .rspin { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: spin .7s linear infinite; flex: none; }
  .orun .pn { font-weight: 600; color: var(--text); }
  .orun .pl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
  .orphan { max-width: 780px; margin: 10px auto; display: flex; align-items: center; gap: 12px; background: var(--warn-bg); border: 1px solid var(--amber); border-radius: 12px; padding: 10px 14px; }
  .orphan .omsg { flex: 1; display: flex; align-items: center; gap: 8px; color: var(--warn-text); font-size: 13px; }
  .orphan .send { flex: none; width: auto; padding: 0 14px; }
  .qcard { max-width: 780px; margin: 12px auto; border: 1px solid var(--accent); border-radius: 14px; padding: 12px 16px; background: var(--accent-weak); }
  .qcard.answered { opacity: .75; }
  .qhead { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .qtext { font-size: 14.5px; color: var(--text); margin-bottom: 10px; }
  .qopts { display: flex; flex-wrap: wrap; gap: 8px; }
  .qopt { background: var(--bg); border: 1px solid var(--border-strong); color: var(--text); border-radius: 9px; padding: 7px 14px; cursor: pointer; font: inherit; font-size: 13px; }
  .qopt:hover { border-color: var(--accent); }
  .qopt.chosen { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .qopt:disabled { cursor: default; }
  .qhint { font-size: 12px; color: var(--muted); }

  .act { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin: 3px 0; padding: 3px 0; }
  .act .ic { opacity: .8; }
  .act.sub { color: var(--accent); }
  .act .el { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sysline { text-align: center; margin: 18px 0; } .sysline span { font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 20px; padding: 4px 12px; }
  .banner { text-align: center; margin: 12px 0; } .banner span { font-size: 12.5px; color: var(--amber); background: var(--amber-bg); border-radius: 20px; padding: 5px 14px; }
  .banner.err span { color: var(--err); background: var(--err-bg); }

  /* composer */
  .composer-wrap { flex: none; padding: 10px 24px 18px; }
  .composer { max-width: 780px; margin: 0 auto; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .composer:focus-within { border-color: var(--accent); }
  #attachRow { display: none; gap: 8px; padding: 10px 12px 0; flex-wrap: wrap; }
  #attachRow.show { display: flex; }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 5px 8px; font-size: 12px; }
  .chip img { width: 34px; height: 34px; object-fit: cover; border-radius: 6px; }
  .chip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; }
  textarea { width: 100%; border: none; background: transparent; color: var(--text); resize: none; padding: 15px 16px 6px; font: inherit; max-height: 240px; outline: none; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px 10px; }
  .select { position: relative; }
  select { appearance: none; background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 9px; padding: 6px 24px 6px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
  select:hover { border-color: var(--border-strong); color: var(--text); }
  .select::after { content: "▾"; position: absolute; right: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--faint); font-size: 10px; }
  .bar .sp { flex: 1; }
  #busy { max-width: 780px; margin: 0 auto 8px; padding: 0 4px; display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--muted); }
  #busy:empty { display: none; }
  #busy .spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: spin .7s linear infinite; flex: none; }
  #busy .lbl { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #busy .tasks { flex: none; white-space: nowrap; color: var(--accent); font-weight: 600; }
  #busy .bmeta { flex: none; white-space: nowrap; color: var(--faint); }
  #busy .stopbtn { flex: none; margin-left: auto; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border-strong); background: transparent; color: var(--muted); border-radius: 7px; padding: 3px 10px; cursor: pointer; font: inherit; font-size: 11.5px; }
  #busy .stopbtn:hover { border-color: #e5484d; color: #e5484d; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .attach { background: none; border: 1px solid var(--border); border-radius: 9px; height: 32px; min-width: 32px; cursor: pointer; color: var(--muted); font-size: 15px; display: inline-grid; place-items: center; }
  .attach:hover { color: var(--text); border-color: var(--border-strong); }
  .send { background: var(--accent); color: var(--on-accent); border: none; border-radius: 10px; height: 32px; width: 34px; display: inline-grid; place-items: center; cursor: pointer; }
  .send:hover { filter: brightness(1.05); }
  .send:disabled { opacity: .4; }

  .pop { position: absolute; bottom: 62px; left: 12px; width: 288px; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; z-index: 30; }
  .pop[hidden] { display: none; }
  .pop h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--faint); margin: 2px 4px 10px; }
  .qa { padding: 10px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 8px; }
  .qa:last-child { margin-bottom: 0; }
  .qa .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .qa .nm { font-weight: 600; font-size: 13px; } .qa .em { font-size: 11px; color: var(--faint); }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: var(--surface-3); color: var(--muted); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.limited { background: var(--amber-bg); color: var(--amber); }
  .g { margin-top: 8px; } .g .lab { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .g .track { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; } .g .track > i { display: block; height: 100%; background: var(--ok); }
  .g .track > i.amber { background: var(--amber); } .g .track > i.red { background: var(--err); }
  .note { font-size: 11px; color: var(--faint); margin-top: 6px; }
  .backdrop { position: fixed; inset: 0; z-index: 25; } .backdrop[hidden] { display: none; }
  .pk-search { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; font: inherit; font-size: 13px; background: var(--bg); color: var(--text); margin-bottom: 8px; outline: none; }
  .pk-search:focus { border-color: var(--accent); }
  .pk-list { max-height: 320px; overflow-y: auto; }
  .pk-item { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  .pk-item:hover { background: var(--surface-2); }
  .pk-item.added { color: var(--faint); cursor: default; } .pk-item.added:hover { background: transparent; }
  .pk-item .tag { margin-left: auto; font-size: 10px; color: var(--faint); }
  .pk-item.sess { align-items: flex-start; }
  .pk-item.sess > div { overflow: hidden; }
  .sess-msg { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess-meta { font-size: 11px; color: var(--faint); margin-top: 2px; }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; } aside { display: none; } }
</style>
<script>
  (function () { var s = null; try { s = localStorage.getItem('x056_theme'); } catch (e) {} if (s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark'); })();
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
  <symbol id="i-compose" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-7.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-switch" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="M16 21l4-4-4-4"/><path d="M20 17H4"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></symbol>
  <symbol id="i-paperclip" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></symbol>
  <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
</defs></svg>
<aside>
  <div class="brand"><span class="mark">x0</span><span>remote control</span><span class="sub">self-hosted</span></div>
  <button class="newbtn" id="newSessionBtn"><svg class="ic sm"><use href="#i-compose"/></svg> New session</button>
  <div class="side-scroll">
    <div class="side-head"><span>Projects</span><button id="addProjectBtn" title="add project"><svg class="ic sm"><use href="#i-plus"/></svg></button></div>
    <div id="projectList"></div>
  </div>
  <div class="acct" id="acctChip" title="usage"><div class="av" id="acctAv">?</div><div class="who"><div class="n" id="acctName">—</div><div class="p" id="acctPlan">usage</div></div></div>
</aside>

<main>
  <div class="topbar">
    <span class="title" id="projTitle">x056</span>
    <span class="cwd" id="projCwd"></span>
    <span class="sp"></span>
    <span id="dot" class="off" title="connection"></span>
    <button class="ico" id="autopilotBtn" title="autopilot — gateway keeps the work going across turns/restarts"><svg class="ic"><use href="#i-repeat"/></svg></button>
    <button class="ico" id="resumeBtn" title="resume an existing session"><svg class="ic"><use href="#i-history"/></svg></button>
    <button class="ico" id="switchBtn" title="force switch account"><svg class="ic"><use href="#i-switch"/></svg></button>
    <button class="ico" id="themeBtn" title="theme"><svg class="ic"><use href="#i-moon"/></svg></button>

        <div class="select"><select id="model" title="model">
          <option value="">Auto model</option><option value="fable">Fable</option><option value="opus">Opus</option><option value="sonnet">Sonnet</option><option value="haiku">Haiku</option>
        </select></div>
        <div class="select"><select id="effort" title="effort">
          <option value="">Auto effort</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="xhigh">Extra high</option><option value="max">Max</option>

<div class="backdrop" id="backdrop" hidden></div>

</div>
<div class="pop" id="sessPicker" hidden style="top:56px; right:12px; left:auto; bottom:auto; width:360px;">

  <div id="sessList" class="pk-list"></div>
</div>

<script>
(function () {
  var TOKEN_KEY = 'x056_token', THEME_KEY = 'x056_theme', MODEL_KEY = 'x056_model', EFFORT_KEY = 'x056_effort';
  var token = localStorage.getItem(TOKEN_KEY);
  if (!token) { token = window.prompt('x056 access token:') || ''; if (token) localStorage.setItem(TOKEN_KEY, token); }
  var $ = function (id) { return document.getElementById(id); };
  var dot = $('dot'), chatEl = $('chat'), promptEl = $('prompt'), sendBtn = $('sendBtn');
  var modelEl = $('model'), effortEl = $('effort'), fileEl = $('file'), attachRow = $('attachRow'), busyEl = $('busy');
  var projListEl = $('projectList'), projTitleEl = $('projTitle'), projCwdEl = $('projCwd');
  var acctChip = $('acctChip'), acctAv = $('acctAv'), acctNameEl = $('acctName'), acctPlan = $('acctPlan');
  var quotaPop = $('quotaPop'), backdrop = $('backdrop'), accountsEl = $('accounts'), themeBtn = $('themeBtn');
  var lastSessionId = null, lastSeq = 0, pendingImage = null, pendingNew = false, currentProjectId = null;

  try { modelEl.value = localStorage.getItem(MODEL_KEY) || ''; effortEl.value = localStorage.getItem(EFFORT_KEY) || ''; } catch (e) {}
  modelEl.addEventListener('change', function () { try { localStorage.setItem(MODEL_KEY, modelEl.value); } catch (e) {} });
  effortEl.addEventListener('change', function () { try { localStorage.setItem(EFFORT_KEY, effortEl.value); } catch (e) {} });
  // Reflect the project's persisted model/effort in the picker (falling back to
  // the global default) so switching projects shows what that one actually runs.
  function syncPicker(pid) {
    var p = projCache[pid]; if (!p) return;
    try {
      modelEl.value = p.model || localStorage.getItem(MODEL_KEY) || '';
      effortEl.value = p.effort || localStorage.getItem(EFFORT_KEY) || '';
    } catch (e) {}
  }

  function api(path, opts) { opts = opts || {}; opts.headers = Object.assign({ Authorization: 'Bearer ' + token }, opts.body ? { 'Content-Type': 'application/json' } : {}); return fetch(path, opts); }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function icon(name, cls) {
    var svg = document.createElementNS(SVGNS, 'svg'); svg.setAttribute('class', 'ic ' + (cls || ''));
    var use = document.createElementNS(SVGNS, 'use'); use.setAttribute('href', '#i-' + name); svg.appendChild(use);
    return svg;
  }
  $('tokenBtn').addEventListener('click', function () { localStorage.removeItem(TOKEN_KEY); location.reload(); });

  var systemDark = matchMedia('(prefers-color-scheme: dark)');
  function curTheme() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function applyTheme(t) { if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); else document.documentElement.removeAttribute('data-theme'); themeBtn.textContent = ''; themeBtn.appendChild(icon(t === 'dark' ? 'sun' : 'moon')); }
  applyTheme(curTheme());
  themeBtn.addEventListener('click', function () { var n = curTheme() === 'dark' ? 'light' : 'dark'; try { localStorage.setItem(THEME_KEY, n); } catch (e) {} applyTheme(n); });
  systemDark.addEventListener('change', function (e) { var s = null; try { s = localStorage.getItem(THEME_KEY); } catch (err) {} if (!s) applyTheme(e.matches ? 'dark' : 'light'); });

  // markdown (DOM-only)
  function renderInline(text) {
    var frag = document.createDocumentFragment(), re = /(`([^`]+)`)|(\*\*([^*]+)\*\*)|(\*([^*\s][^*]*)\*)|(\[([^\]]+)\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>()\[\]]+)/g, last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      if (m[2]) { var c = document.createElement('code'); c.textContent = m[2]; frag.appendChild(c); }
      else if (m[4]) { var b = document.createElement('strong'); b.textContent = m[4]; frag.appendChild(b); }
      else if (m[6]) { var em = document.createElement('em'); em.textContent = m[6]; frag.appendChild(em); }
      else if (m[8]) { var a = document.createElement('a'); a.textContent = m[8]; a.href = m[9]; a.target = '_blank'; a.rel = 'noopener noreferrer'; frag.appendChild(a); }
      else if (m[10]) { // bare URL — autolink, keeping trailing punctuation as text
        var url = m[10], trail = '';
        var tm = /[.,;:!?]+$/.exec(url);
        if (tm) { trail = tm[0]; url = url.slice(0, -trail.length); }
        var a2 = document.createElement('a'); a2.textContent = url; a2.href = url; a2.target = '_blank'; a2.rel = 'noopener noreferrer'; frag.appendChild(a2);
        if (trail) frag.appendChild(document.createTextNode(trail));
      }
      last = re.lastIndex;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    return frag;
  }
  function renderMarkdown(text) {
    var root = document.createDocumentFragment(), lines = text.split('\n'), i = 0, m, para = [];
    function flush() { if (!para.length) return; var p = document.createElement('p'); p.appendChild(renderInline(para.join('\n'))); root.appendChild(p); para.length = 0; }
    function splitRow(l) { l = l.trim(); if (l.charAt(0) === '|') l = l.slice(1); if (l.charAt(l.length - 1) === '|') l = l.slice(0, -1); return l.split('|').map(function (s) { return s.trim(); }); }
    while (i < lines.length) {
      var line = lines[i];
      if (/^```/.test(line)) { flush(); var buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; } i++; var pre = document.createElement('pre'); var code = document.createElement('code'); code.textContent = buf.join('\n'); pre.appendChild(code); root.appendChild(pre); continue; }
      if ((m = /^(#{1,3})\s+(.*)$/.exec(line))) { flush(); var h = document.createElement('h' + (m[1].length + 2)); h.appendChild(renderInline(m[2])); root.appendChild(h); i++; continue; }
      // GFM table: header row + separator row of dashes/colons
      if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].indexOf('-') >= 0) {
        flush();
        var table = document.createElement('table');
        var thead = document.createElement('thead'), trh = document.createElement('tr');
        splitRow(line).forEach(function (c) { var th = document.createElement('th'); th.appendChild(renderInline(c)); trh.appendChild(th); });
        thead.appendChild(trh); table.appendChild(thead);
        var tbody = document.createElement('tbody');
        i += 2;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
          var tr = document.createElement('tr');
          splitRow(lines[i]).forEach(function (c) { var td = document.createElement('td'); td.appendChild(renderInline(c)); tr.appendChild(td); });
          tbody.appendChild(tr); i++;
        }
        table.appendChild(tbody); root.appendChild(table); continue;
      }
      if (/^\s*[-*]\s+/.test(line) || /^\s*\d+[.)]\s+/.test(line)) { flush(); var ord = /^\s*\d+[.)]\s+/.test(line); var list = document.createElement(ord ? 'ol' : 'ul'); var ir = ord ? /^\s*\d+[.)]\s+(.*)$/ : /^\s*[-*]\s+(.*)$/; while (i < lines.length && (m = ir.exec(lines[i]))) { var li = document.createElement('li'); li.appendChild(renderInline(m[1])); list.appendChild(li); i++; } root.appendChild(list); continue; }
      if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { flush(); root.appendChild(document.createElement('hr')); i++; continue; }
      if ((m = /^>\s?(.*)$/.exec(line))) { flush(); var bq = document.createElement('blockquote'); var qb = []; while (i < lines.length && (m = /^>\s?(.*)$/.exec(lines[i]))) { qb.push(m[1]); i++; } bq.appendChild(renderInline(qb.join('\n'))); root.appendChild(bq); continue; }
      if (line.trim() === '') { flush(); i++; continue; }
      para.push(line); i++;
    }
    flush(); return root;
  }

  var scroller = document.querySelector('.scroll');
  function atBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 140; }
  function down() { scroller.scrollTop = scroller.scrollHeight; }

  // Per-project view cache: every project keeps its rendered thread (detached
  // DocumentFragment when not in view) + live activity state, so switching is
  // instant and background projects keep accumulating their output.
  var views = {};
  function viewOf(pid) {
    if (!views[pid]) views[pid] = { frag: document.createDocumentFragment(), label: '', subs: {}, subCount: 0, active: false, loaded: false };
    return views[pid];
  }
  function appendNode(pid, node) {
    if (!pid || pid === currentProjectId) { var stick = atBottom(); chatEl.appendChild(node); if (stick) down(); }
    else viewOf(pid).frag.appendChild(node);
  }

  function nodeMsg(role, text, imgUrl) {
    var wrap = document.createElement('div'); wrap.className = 'msg ' + role;
    var lab = document.createElement('div'); lab.className = 'role'; lab.textContent = role === 'user' ? 'you' : 'claude'; wrap.appendChild(lab);
    var content = document.createElement('div'); content.className = 'content';
    if (role === 'assistant') content.appendChild(renderMarkdown(text)); else content.appendChild(document.createTextNode(text));
    if (imgUrl) { var im = document.createElement('img'); im.className = 'att'; im.src = imgUrl; content.appendChild(im); }
    wrap.appendChild(content); return wrap;
  }
  function nodeSys(text, cls) { var d = document.createElement('div'); d.className = cls || 'sysline'; var s = document.createElement('span'); s.textContent = text; d.appendChild(s); return d; }
  function nodeAct(label, isSub) { var d = document.createElement('div'); d.className = 'act' + (isSub ? ' sub' : ''); d.appendChild(icon(isSub ? 'sparkles' : 'terminal', 'sm')); var e = document.createElement('span'); e.className = 'el'; e.textContent = label; d.appendChild(e); return d; }
  function addMsg(role, text, imgUrl) { appendNode(currentProjectId, nodeMsg(role, text, imgUrl)); }
  function addSys(text, cls) { appendNode(currentProjectId, nodeSys(text, cls)); }

  var BANNERS = { limit_detected: 'limit reached — switching accounts…', forced_switch: 'switching accounts…', failover: 'switched account', parked: 'all accounts limited — parked', turn_failed: 'turn failed', flap_guard_tripped: 'too many switches — stopped' };
  var active = false, lastLabel = '', runningSubs = 0, subs = {};
  var runningProjects = {}; // projectId -> true while a turn runs there
  var acctNames = {}; // registry name (a/b) -> display name
  var activeModel = {}, activeAccount = {}; // per pid: model id / account name in this turn
  var pendingQ = {};   // pid -> unanswered question data (survives history reloads / SSE replays)
  function acctName(n) { return acctNames[n] || n; }
  function modelLabel(m) {
    if (!m) return '';
    var s = String(m).toLowerCase();
    if (s.indexOf('fable') >= 0) return 'Fable'; if (s.indexOf('opus') >= 0) return 'Opus';
    if (s.indexOf('sonnet') >= 0) return 'Sonnet'; if (s.indexOf('haiku') >= 0) return 'Haiku';
    return String(m).replace(/^claude-/, '');
  }
  function renderBusy() {
    busyEl.textContent = '';
    if (!active) return;
    var s = document.createElement('span'); s.className = 'spin'; busyEl.appendChild(s);
    var l = document.createElement('span'); l.className = 'lbl'; l.textContent = lastLabel || 'working…'; busyEl.appendChild(l);
    if (runningSubs > 0) { var t = document.createElement('span'); t.className = 'tasks'; t.textContent = '· ' + runningSubs + ' running'; busyEl.appendChild(t); }
    var meta = []; var ml = modelLabel(activeModel[currentProjectId]); if (ml) meta.push(ml);
    var ac = activeAccount[currentProjectId]; if (ac) meta.push(acctName(ac));
    if (meta.length) { var mm = document.createElement('span'); mm.className = 'bmeta'; mm.textContent = '· ' + meta.join(' · '); busyEl.appendChild(mm); }
    var stop = document.createElement('button'); stop.className = 'stopbtn'; stop.title = 'stop this turn'; stop.appendChild(icon('x', 'sm'));
    var sl = document.createElement('span'); sl.textContent = 'Stop'; stop.appendChild(sl);
    stop.addEventListener('click', stopCurrentTurn); busyEl.appendChild(stop);
  }
  function stopCurrentTurn() {
    if (!currentProjectId) return;
    api('/api/sessions/current/stop', { method: 'POST', body: JSON.stringify({ projectId: currentProjectId }) })
      .then(function (r) { if (r.ok) addSys('stopping this turn…', 'banner'); else if (r.status === 409) addSys('no turn running here', 'banner'); })
      .catch(function () {});
  }
  // Live strip above the composer: what every OTHER running project is doing,
  // so parallel work is visible without leaving the current chat.
  function renderStrip() {
    var el = $('otherRuns'); el.textContent = '';
    Object.keys(runningProjects).forEach(function (pid) {
      if (pid === currentProjectId || !projCache[pid]) return;
      var v = viewOf(pid);
      var row = document.createElement('div'); row.className = 'orun';
      var sp = document.createElement('span'); sp.className = 'rspin'; row.appendChild(sp);
      var pn = document.createElement('span'); pn.className = 'pn'; pn.textContent = projCache[pid].name; row.appendChild(pn);
      var pl = document.createElement('span'); pl.className = 'pl'; pl.textContent = v.label || 'working…'; row.appendChild(pl);
      if (v.subCount > 0) { var t = document.createElement('span'); t.className = 'tasks'; t.textContent = '· ' + v.subCount + ' running'; row.appendChild(t); }
      row.addEventListener('click', function () { switchProject(projCache[pid]); });
      el.appendChild(row);
    });
  }
  // Events are global, tagged with projectId. Current project renders into the
  // live chat; others render into their cached fragment and feed the strip.
  function handleEvent(kind, data) {
    var pid = data.projectId || currentProjectId;
    var mine = !data.projectId || data.projectId === currentProjectId;
    var v = viewOf(pid);
    if (kind === 'turn_state') {
      v.active = !!data.active;
      if (data.active) runningProjects[pid] = true;
      else { delete runningProjects[pid]; v.label = ''; v.subs = {}; v.subCount = 0; }
      markRunning(); renderStrip();
      if (mine) { active = v.active; if (!active) { lastLabel = ''; runningSubs = 0; subs = {}; } renderBusy(); renderAccountChip(); }
      return;
    }
    if (kind === 'assistant_text') appendNode(pid, nodeMsg('assistant', data.text));
    else if (kind === 'supervisor') {
      if (data.type === 'turn_started' && data.account) { activeAccount[pid] = data.account; if (mine) { renderBusy(); renderAccountChip(); } }
      var l = BANNERS[data.type]; if (l) appendNode(pid, nodeSys(l, 'banner'));
    }
    else if (kind === 'active_model') { if (data.model) { activeModel[pid] = data.model; if (mine) renderBusy(); } }
    else if (kind === 'activity') {
      // Derive the running-subagent count from the tracked set (idempotent), so a
      // replayed/duplicated 'start' can't inflate it (the "· N running" drift).
      if (data.status === 'start') {
        v.label = data.label; appendNode(pid, nodeAct(data.label, data.isSubagent));
        if (data.isSubagent && data.toolUseId) v.subs[data.toolUseId] = 1;
      } else if (data.toolUseId) { delete v.subs[data.toolUseId]; }
      v.subCount = Object.keys(v.subs).length;
      if (mine) { lastLabel = v.label; runningSubs = v.subCount; subs = v.subs; if (active) renderBusy(); }
      renderStrip();
    }
    else if (kind === 'session_started') { clearQuestion(pid); if (data.model) activeModel[pid] = data.model; if (mine) { active = true; renderBusy(); } }
    else if (kind === 'session_done') {
      appendNode(pid, nodeSys('done: ' + data.status + (data.finalAccount ? ' · ' + acctName(data.finalAccount) : '') + (data.failovers ? ' · ' + data.failovers + ' switch(es)' : '')));
      if (mine) { active = false; renderBusy(); }
      pollAccounts(); renderStrip();
    }
    else if (kind === 'session_error') {
      appendNode(pid, nodeSys('error: ' + data.message, 'banner err'));
      if (mine) { active = false; renderBusy(); }
      renderStrip();
    }
    else if (kind === 'question') {
      pendingQ[pid] = data; showQuestion(pid, data);
      if (pid !== currentProjectId) notify('Claude has a question', (projCache[pid] ? projCache[pid].name : 'a project') + ': ' + String(data.question || '').slice(0, 80));
    }
    else if (kind === 'autopilot') {
      if (data.active) apState[pid] = data.remaining; else delete apState[pid];
      if (pid === currentProjectId) renderAutopilot();
      if (!data.active && data.reason === 'done' && pid !== currentProjectId) notify('Autopilot done', (projCache[pid] ? projCache[pid].name : 'a project') + ' finished its task');
    }
    else if (kind === 'turn_orphaned') {
      var pname = projCache[pid] ? projCache[pid].name : (data.projectName || 'a project');
      notify('Turn interrupted', pname + ' stopped mid-turn — resume it in the panel');
      appendNode(pid, nodeOrphan(pid, data));
    }
    else if (kind === 'project_selected') { /* another tab switched; ignore */ }
    else if (kind === 'project_removed') {
      // removed elsewhere (another tab) — drop caches and reconcile the list
      var wasCur = currentProjectId === data.id;
      delete views[data.id]; delete projCache[data.id]; delete runningProjects[data.id]; delete apState[data.id];
      if (wasCur) { currentProjectId = null; chatEl.textContent = ''; }
      loadProjects().then(function () { if (wasCur && currentProjectId && projCache[currentProjectId]) switchProject(projCache[currentProjectId]); });
    }
  }
  // Card shown when Claude ended its turn asking the user something.
  function nodeQuestion(pid, data) {
    var d = document.createElement('div'); d.className = 'qcard';
    var head = document.createElement('div'); head.className = 'qhead';
    head.appendChild(icon('sparkles', 'sm'));
    var h = document.createElement('span'); h.textContent = 'Claude is asking'; head.appendChild(h);
    d.appendChild(head);
    var q = document.createElement('div'); q.className = 'qtext'; q.appendChild(renderInline(String(data.question || ''))); d.appendChild(q);
    var opts = Array.isArray(data.options) ? data.options : [];
    if (opts.length) {
      var row = document.createElement('div'); row.className = 'qopts';
      opts.forEach(function (o) {
        var b = document.createElement('button'); b.className = 'qopt'; b.textContent = o;
        b.addEventListener('click', function () { answerQuestion(pid, d, o); });
        row.appendChild(b);
      });
      d.appendChild(row);
    } else {
      var hint = document.createElement('div'); hint.className = 'qhint'; hint.textContent = 'Type your answer in the message box below.'; d.appendChild(hint);
    }
    return d;
  }
  // A question is an ephemeral SSE event, not part of the transcript, so a history
  // reload (project switch, refresh, SSE reconnect) would wipe its card. Keep the
  // pending one in state and (re)render it idempotently so it survives every wipe
  // and any replay ordering.
  function qContainer(pid) { return (!pid || pid === currentProjectId) ? chatEl : viewOf(pid).frag; }
  function showQuestion(pid, data) {
    // DOM-authoritative dedupe: drop any prior *unanswered* card in this pid's
    // container (survives SSE replays / reload races regardless of key/timing);
    // answered cards lack .pending so they're left in place.
    var c = qContainer(pid), old = c.querySelectorAll('.qcard.pending');
    for (var i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);
    var node = nodeQuestion(pid, data); node.classList.add('pending'); appendNode(pid, node);
  }
  function clearQuestion(pid) {
    var c = qContainer(pid), old = c.querySelectorAll('.qcard.pending');
    for (var i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);
    delete pendingQ[pid];
  }
  function answerQuestion(pid, card, answer) {
    // this question is handled now — stop tracking it as pending (keep the card, locked)
    delete pendingQ[pid]; card.classList.remove('pending');
    card.classList.add('answered');
    var buttons = card.querySelectorAll('.qopt');
    for (var i = 0; i < buttons.length; i++) { buttons[i].disabled = true; if (buttons[i].textContent === answer) buttons[i].classList.add('chosen'); }
    addMsg('user', answer);
    api('/api/sessions/current/messages', { method: 'POST', body: JSON.stringify({ projectId: pid, prompt: answer }) })
      .then(function (r) { if (r.status === 409) addSys('a turn is already running there', 'banner'); }).catch(function () {});
  }
  // Persistent card shown when a turn died mid-flight (crash/restart) — click to resume.
  function nodeOrphan(pid, data) {
    var d = document.createElement('div'); d.className = 'orphan';
    var msg = document.createElement('div'); msg.className = 'omsg';
    msg.appendChild(icon('history', 'sm'));
    var t = document.createElement('span'); t.textContent = 'This turn was interrupted (crash or restart)' + (data.prompt ? ' — “' + String(data.prompt).slice(0, 80) + '”' : '') + '. Resume it?'; msg.appendChild(t);
    d.appendChild(msg);
    var btn = document.createElement('button'); btn.className = 'send'; btn.textContent = 'Resume';
    btn.addEventListener('click', function () { d.remove(); resumeProject(pid); });
    d.appendChild(btn);
    return d;
  }
  function resumeProject(pid) {
    api('/api/sessions/current/messages', { method: 'POST', body: JSON.stringify({ projectId: pid, prompt: 'Continue from where you left off. If your last action was a command or edit that may have partially applied, verify its actual effect before re-running anything with side effects.' }) })
      .then(function (r) { if (r.status === 409) addSys('a turn is already running there', 'banner'); }).catch(function () {});
  }
  // ---- autopilot (gateway-driven continuation) ----
  var apState = {}; // pid -> remaining
  function renderAutopilot() {
    var bar = $('autopilotBar'); bar.textContent = '';
    var rem = apState[currentProjectId];
    if (rem === undefined) return;
    var d = document.createElement('div'); d.className = 'apbar';
    d.appendChild(icon('repeat', 'sm'));
    var l = document.createElement('span'); l.className = 'lbl'; l.textContent = 'Autopilot on — gateway will keep this going (' + rem + ' step' + (rem === 1 ? '' : 's') + ' left, or until the task says done)'; d.appendChild(l);
    var stop = document.createElement('button'); stop.textContent = 'Stop'; stop.addEventListener('click', function () { api('/api/autopilot/stop', { method: 'POST', body: JSON.stringify({ projectId: currentProjectId }) }).catch(function () {}); }); d.appendChild(stop);
    bar.appendChild(d);
  }
  $('autopilotBtn').addEventListener('click', function () {
    if (!currentProjectId) return;
    if (apState[currentProjectId] !== undefined) { api('/api/autopilot/stop', { method: 'POST', body: JSON.stringify({ projectId: currentProjectId }) }).catch(function () {}); return; }
    var n = window.prompt('Autopilot: how many times should the gateway auto-continue this project?\n\nAfter each turn it sends "keep going" until the task replies AUTOPILOT_DONE or this many steps run out. Survives turn-end and restarts.', '20');
    if (!n) return; var count = parseInt(n, 10); if (!(count > 0)) return;
    api('/api/autopilot', { method: 'POST', body: JSON.stringify({ projectId: currentProjectId, count: count }) }).catch(function () {});
  });
  function loadAutopilot() { return api('/api/autopilot').then(function (r) { return r.json(); }).then(function (m) { apState = {}; Object.keys(m || {}).forEach(function (pid) { apState[pid] = m[pid].remaining; }); renderAutopilot(); }).catch(function () {}); }

  // ---- browser notifications ----
  var notifyAsked = false;
  function notify(title, body) {
    try {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'granted') { new Notification(title, { body: body }); return; }
      if (Notification.permission !== 'denied' && !notifyAsked) { notifyAsked = true; Notification.requestPermission().then(function (p) { if (p === 'granted') new Notification(title, { body: body }); }); }
    } catch (e) {}
  }

  // ---- projects ----
  function markRunning() {
    var rows = projListEl.querySelectorAll('.proj');
    for (var i = 0; i < rows.length; i++) { var id = rows[i].getAttribute('data-id'); if (runningProjects[id]) rows[i].classList.add('busy'); else rows[i].classList.remove('busy'); }
  }
  var projCache = {}; // pid -> project object (for the strip + quick switch)
  // Highlight/title follow the CLIENT's currentProjectId, adopting the server's
  // default only before the user has picked one. Keying off reg.current instead
  // raced the not-yet-acked select POST → wrong title + navbar selection.
  function markActiveProject(pid) {
    var rows = projListEl.querySelectorAll('.proj');
    for (var i = 0; i < rows.length; i++) { var id = rows[i].getAttribute('data-id'); if (id === pid) rows[i].classList.add('active'); else rows[i].classList.remove('active'); }
  }
  function renderProjects(reg) {
    if (!currentProjectId) currentProjectId = reg.current;
    var cur = currentProjectId;
    projListEl.textContent = '';
    reg.projects.forEach(function (p) {
      projCache[p.id] = p;
      if (p.running) runningProjects[p.id] = true; else delete runningProjects[p.id];
      var row = document.createElement('div'); row.className = 'proj' + (p.id === cur ? ' active' : '') + (p.running ? ' busy' : '');
      row.setAttribute('data-id', p.id);
      var d = document.createElement('span'); d.className = 'dot'; row.appendChild(d);
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.name; row.appendChild(nm);
      var sp = document.createElement('span'); sp.className = 'rspin'; row.appendChild(sp);
      var rm = document.createElement('button'); rm.className = 'projrm'; rm.title = 'remove project'; rm.appendChild(icon('x', 'sm'));
      rm.addEventListener('click', function (e) { e.stopPropagation(); removeProject(p); });
      row.appendChild(rm);
      row.addEventListener('click', function () { if (p.id !== currentProjectId) switchProject(p); });
      projListEl.appendChild(row);
      if (p.id === cur) { projTitleEl.textContent = p.name; projCwdEl.textContent = p.cwd; }
    });
  }
  function removeProject(p) {
    if (runningProjects[p.id]) { addSys('stop the running turn in “' + p.name + '” before removing it', 'banner'); return; }
    if (!window.confirm('Remove “' + p.name + '” from the projects list?\n\nOnly removes it from the panel — your files and git history are untouched.')) return;
    api('/api/projects/remove', { method: 'POST', body: JSON.stringify({ id: p.id }) }).then(function (r) {
      if (!r.ok) { addSys(r.status === 409 ? 'a turn is running there — stop it first' : 'could not remove project', 'banner'); return; }
      var wasCurrent = currentProjectId === p.id;
      delete views[p.id]; delete projCache[p.id]; delete runningProjects[p.id]; delete apState[p.id];
      if (wasCurrent) { currentProjectId = null; chatEl.textContent = ''; } // let renderProjects adopt the new server current
      loadProjects().then(function () {
        if (wasCurrent && currentProjectId && projCache[currentProjectId]) switchProject(projCache[currentProjectId]);
      });
    }).catch(function () {});
  }
  function loadProjects() { return api('/api/projects').then(function (r) { return r.json(); }).then(renderProjects).catch(function () {}); }
  function switchProject(p) {
    // pure view change — never blocked, even while p (or others) run
    if (currentProjectId && currentProjectId !== p.id) {
      var cv = viewOf(currentProjectId);
      while (chatEl.firstChild) cv.frag.appendChild(chatEl.firstChild); // stash current thread
    }
    currentProjectId = p.id; projCache[p.id] = p;
    projTitleEl.textContent = p.name; projCwdEl.textContent = p.cwd;
    markActiveProject(p.id); // instant navbar highlight, no round-trip
    pendingNew = false;
    var v = viewOf(p.id);
    chatEl.textContent = '';
    var hadCache = v.frag.childNodes.length > 0;
    if (hadCache) {
      chatEl.appendChild(v.frag);
      appendNode(p.id, nodeSys('showing cached view — refreshing…', 'sysline cachenote'));
      down();
    }
    active = !!v.active; lastLabel = v.label; runningSubs = v.subCount; subs = v.subs; renderBusy();
    renderStrip(); renderAutopilot(); renderAccountChip();
    // Commit the selection server-side FIRST — /history and /sessions are keyed to
    // the server's "current" project, so loading before the select lands fetches
    // the wrong project's thread. Guard each step against a newer switch.
    syncPicker(p.id);
    api('/api/projects/current', { method: 'POST', body: JSON.stringify({ id: p.id }) })
      .then(function () { if (currentProjectId !== p.id) return null; return pollSnapshot(); })
      .then(function (s) { if (!s || currentProjectId !== p.id) return; return loadProjects().then(function () { if (currentProjectId === p.id) syncPicker(p.id); loadHistory(); }); })
      .catch(function () {});
  }
  // ---- add-project picker (lists workspace repos) ----
  var projPicker = $('projPicker'), projPickList = $('projPickList'), projSearch = $('projSearch');
  var workspaceDirs = [];
  function renderPickList(q) {
    projPickList.textContent = '';
    var ql = (q || '').toLowerCase();
    var shown = workspaceDirs.filter(function (d) { return (d.rel || d.name).toLowerCase().indexOf(ql) >= 0; });
    if (!shown.length) { var e = document.createElement('div'); e.className = 'pk-item added'; e.textContent = 'no matching repos'; projPickList.appendChild(e); return; }
    shown.forEach(function (d) {
      var it = document.createElement('div'); it.className = 'pk-item' + (d.isProject ? ' added' : '');
      it.appendChild(icon('folder', 'sm'));
      var nm = document.createElement('span'); nm.style.overflow = 'hidden'; nm.style.textOverflow = 'ellipsis'; nm.style.whiteSpace = 'nowrap'; nm.textContent = d.rel || d.name; it.appendChild(nm);
      if (d.isProject) { var tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = 'added'; it.appendChild(tag); }
      else it.addEventListener('click', function () { createProjectFromDir(d); });
      projPickList.appendChild(it);
    });
  }
  function createProjectFromDir(d) {
    api('/api/projects', { method: 'POST', body: JSON.stringify({ name: d.name, cwd: d.path }) }).then(function (r) {
      if (!r.ok) return r.json().then(function (j) { addSys('could not add project: ' + (j.message || r.status), 'banner'); });
      return r.json().then(function (p) { closeAllPops(); switchProject(p); });
    }).catch(function () {});
  }
  projSearch.addEventListener('input', function () { renderPickList(projSearch.value); });
  $('addProjectBtn').addEventListener('click', function () {
    api('/api/workspace').then(function (r) { return r.json(); }).then(function (dirs) {
      workspaceDirs = Array.isArray(dirs) ? dirs : [];
      projSearch.value = ''; renderPickList('');
      openPop(projPicker); projSearch.focus();
    }).catch(function () {});
  });
  $('newSessionBtn').addEventListener('click', function () { pendingNew = true; chatEl.textContent = ''; addSys('new session — send a message to begin'); promptEl.focus(); });

  // ---- accounts / quota ----
  function gCls(p) { return p >= 90 ? 'red' : p >= 70 ? 'amber' : ''; }
  function gauge(label, u) {
    var p = Math.round((u.utilization || 0) * (u.utilization > 1 ? 1 : 100)); p = Math.max(0, Math.min(100, p));
    var g = document.createElement('div'); g.className = 'g'; var lab = document.createElement('div'); lab.className = 'lab';
    var a = document.createElement('span'); a.textContent = label; var b = document.createElement('span'); b.textContent = p + '%'; lab.appendChild(a); lab.appendChild(b); g.appendChild(lab);
    var tr = document.createElement('div'); tr.className = 'track'; var i = document.createElement('i'); if (gCls(p)) i.classList.add(gCls(p)); i.style.width = p + '%'; tr.appendChild(i); g.appendChild(tr); return g;
  }
  var acctList = []; // last /api/accounts response (for the bottom-left chip)
  function renderAccounts(list) {
    acctList = Array.isArray(list) ? list : [];
    accountsEl.textContent = '';
    acctList.forEach(function (a) {
      acctNames[a.name] = a.displayName || a.name; // for done-banners etc.
      var st = a.state || { kind: 'unknown' };
      var card = document.createElement('div'); card.className = 'qa';
      var top = document.createElement('div'); top.className = 'top'; var left = document.createElement('div');
      var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = a.displayName || a.name; left.appendChild(nm);
      if (a.email) { var em = document.createElement('div'); em.className = 'em'; em.textContent = a.email; left.appendChild(em); }
      top.appendChild(left);
      var badge = document.createElement('span'); badge.className = 'badge';
      if (st.kind === 'ok') { badge.classList.add('ok'); badge.textContent = 'active'; } else if (st.kind === 'limited') { badge.classList.add('limited'); badge.textContent = 'limited'; } else badge.textContent = 'idle';
      top.appendChild(badge); card.appendChild(top);
      if (a.quota) { card.appendChild(gauge('5-hour', a.quota.fiveHour)); card.appendChild(gauge('7-day', a.quota.sevenDay)); if (a.quotaStale) { var s = document.createElement('div'); s.className = 'note'; s.textContent = 'cached — refreshing'; card.appendChild(s); } }
      else { var n = document.createElement('div'); n.className = 'note'; n.textContent = a.quotaError ? 'usage unavailable — retrying' : 'usage unavailable'; card.appendChild(n); }
      accountsEl.appendChild(card);
    });
    renderAccountChip();
  }
  // The bottom-left chip shows the account actually in use: the one running the
  // viewed project's turn if known, else an OK one, else the limited one that
  // resets soonest — so it never blanks to "—/?" even when both are limited.
  function pickPrimaryAccount() {
    function byName(n) { for (var i = 0; i < acctList.length; i++) if (acctList[i].name === n) return acctList[i]; return null; }
    if (runningProjects[currentProjectId]) { var live = byName(activeAccount[currentProjectId]); if (live) return live; }
    var ok = null, nonLim = null, soonest = null;
    acctList.forEach(function (a) {
      var k = (a.state && a.state.kind) || 'unknown';
      if (k === 'ok' && !ok) ok = a;
      if (k !== 'limited' && !nonLim) nonLim = a;
      if (k === 'limited' && (!soonest || (a.state.until || 0) < (soonest.state.until || 0))) soonest = a;
    });
    return ok || nonLim || soonest || acctList[0] || null;
  }
  function renderAccountChip() {
    var a = pickPrimaryAccount(); if (!a) return;
    var nm = a.displayName || a.name;
    acctNameEl.textContent = nm; acctAv.textContent = (nm[0] || '?').toUpperCase();
    var live = runningProjects[currentProjectId] && activeAccount[currentProjectId] === a.name;
    var lim = a.state && a.state.kind === 'limited';
    acctPlan.textContent = live ? 'Max · active now' : (lim ? 'Max · limited' : 'Max · view usage');
  }
  function pollAccounts() { return api('/api/accounts').then(function (r) { return r.json(); }).then(renderAccounts).catch(function () {}); }
  var sessPicker = $('sessPicker'), sessList = $('sessList');
  function hidePops() { quotaPop.hidden = true; projPicker.hidden = true; sessPicker.hidden = true; }
  function closeAllPops() { hidePops(); backdrop.hidden = true; }
  function openPop(el) { hidePops(); el.hidden = false; backdrop.hidden = false; }
  function togglePop(show) { var open = show === undefined ? quotaPop.hidden : show; if (open) { openPop(quotaPop); pollAccounts(); } else closeAllPops(); }
  acctChip.addEventListener('click', function () { togglePop(); });
  backdrop.addEventListener('click', closeAllPops);

  // ---- resume an existing session ----
  function relTime(iso) {
    var t = Date.parse(iso); if (isNaN(t)) return '';
    var s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 90) return 'just now';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    if (s < 86400 * 30) return Math.round(s / 86400) + 'd ago';
    return new Date(t).toLocaleDateString();
  }
  function resumeSession(s) {
    api('/api/resume-session', { method: 'POST', body: JSON.stringify({ projectId: currentProjectId, sessionId: s.id }) }).then(function (r) {
      if (!r.ok) return r.json().then(function (j) { addSys('could not resume: ' + (j.message || r.status), 'banner'); });
      closeAllPops(); chatEl.textContent = ''; pendingNew = false; lastSessionId = s.id; pollSnapshot().then(loadHistory);
    }).catch(function () {});
  }
  function openSessions() {
    if (!currentProjectId) return;
    sessList.textContent = ''; var ld = document.createElement('div'); ld.className = 'pk-item added'; ld.textContent = 'loading…'; sessList.appendChild(ld);
    openPop(sessPicker);
    api('/api/available-sessions?projectId=' + encodeURIComponent(currentProjectId)).then(function (r) { return r.json(); }).then(function (list) {
      sessList.textContent = '';
      if (!Array.isArray(list) || !list.length) { var e = document.createElement('div'); e.className = 'pk-item added'; e.textContent = 'no existing sessions for this repo'; sessList.appendChild(e); return; }
      list.forEach(function (s) {
        var it = document.createElement('div'); it.className = 'pk-item sess';
        var col = document.createElement('div');
        var m = document.createElement('div'); m.className = 'sess-msg'; m.textContent = s.firstMessage || '(no preview)'; col.appendChild(m);
        var meta = document.createElement('div'); meta.className = 'sess-meta'; meta.textContent = relTime(s.updatedAt) + ' · ' + s.messages + ' msgs'; col.appendChild(meta);
        it.appendChild(col);
        it.addEventListener('click', function () { resumeSession(s); });
        sessList.appendChild(it);
      });
    }).catch(function () { sessList.textContent = ''; var e = document.createElement('div'); e.className = 'pk-item added'; e.textContent = 'could not load sessions'; sessList.appendChild(e); });
  }
  $('resumeBtn').addEventListener('click', openSessions);

  function pollSnapshot() { return api('/api/sessions').then(function (r) { return r.json(); }).then(function (s) { lastSessionId = s.lastSessionId; if (!currentProjectId) currentProjectId = s.currentProjectId; return s; }); }
  function loadHistory() {
    var pid = currentProjectId;
    return api('/api/sessions/current/history?limit=80').then(function (r) { return r.json(); }).then(function (rows) {
      if (currentProjectId !== pid) return; // user switched away while loading
      chatEl.textContent = ''; // replace cached view with the fresh transcript
      viewOf(pid).loaded = true;
      if (!Array.isArray(rows) || rows.length === 0) {
        addSys('no messages yet — say hello, or use the resume button for an existing session');
        return;
      }
      addSys(rows.length + ' earlier messages'); rows.forEach(function (m) { addMsg(m.role === 'user' ? 'user' : 'assistant', m.text); }); addSys('live');
      if (pendingQ[pid]) showQuestion(pid, pendingQ[pid]); // re-attach a still-open question the transcript doesn't carry
      // Sync the live busy state from this project's view — events may have set it
      // before currentProjectId was known (so the global `active` never caught it)
      // — and re-surface the current action, which the wiped transcript can't carry.
      var lv = viewOf(pid);
      active = !!lv.active; lastLabel = lv.label || ''; runningSubs = lv.subCount || 0; subs = lv.subs || {}; renderBusy();
      if (lv.active && lv.label) appendNode(pid, nodeAct(lv.label, false));
      down();
    }).catch(function () {});
  }

  loadProjects().then(function () { if (currentProjectId) syncPicker(currentProjectId); }); setInterval(pollAccounts, 60000); pollAccounts(); loadAutopilot();
  pollSnapshot().then(loadHistory);

  // ---- SSE ----
  var es = null;
  function connect() {
    if (es) es.close();
    es = new EventSource('/api/sessions/current/stream?token=' + encodeURIComponent(token) + '&since=' + lastSeq);
    es.onopen = function () { dot.className = 'on'; };
    es.onerror = function () { dot.className = 'off'; es.close(); setTimeout(connect, 2000); };
    ['session_started', 'assistant_text', 'supervisor', 'session_done', 'session_error', 'activity', 'turn_state', 'project_selected', 'project_removed', 'turn_orphaned', 'autopilot', 'question', 'active_model'].forEach(function (kind) {
      es.addEventListener(kind, function (evt) { if (evt.lastEventId) lastSeq = Number(evt.lastEventId) || lastSeq; var data; try { data = JSON.parse(evt.data); } catch (e) { return; } handleEvent(kind, data.data || {}); });
    });
  }
  connect();

  // ---- composer ----
  function autogrow() { promptEl.style.height = 'auto'; promptEl.style.height = Math.min(promptEl.scrollHeight, 240) + 'px'; }
  promptEl.addEventListener('input', autogrow);
  function setImage(u) {
    pendingImage = u; attachRow.textContent = '';
    if (!u) { attachRow.classList.remove('show'); return; }
    var chip = document.createElement('div'); chip.className = 'chip'; var img = document.createElement('img'); img.src = u; chip.appendChild(img);
    var sp = document.createElement('span'); sp.textContent = 'image attached'; chip.appendChild(sp);
    var x = document.createElement('button'); x.appendChild(icon('x', 'sm')); x.addEventListener('click', function () { setImage(null); }); chip.appendChild(x);
    attachRow.appendChild(chip); attachRow.classList.add('show');
  }
  function fileToImage(f) { if (!f || !/^image\//.test(f.type)) return; var r = new FileReader(); r.onload = function () { setImage(r.result); }; r.readAsDataURL(f); }
  fileEl.addEventListener('change', function () { if (fileEl.files[0]) fileToImage(fileEl.files[0]); fileEl.value = ''; });
  promptEl.addEventListener('paste', function (e) { var items = (e.clipboardData || {}).items || []; for (var i = 0; i < items.length; i++) if (items[i].type && items[i].type.indexOf('image') === 0) { var f = items[i].getAsFile(); if (f) { e.preventDefault(); fileToImage(f); return; } } });

  function send() {
    var text = promptEl.value.trim(); if (!text && !pendingImage) return;
    var body = { prompt: text }; if (modelEl.value) body.model = modelEl.value; if (effortEl.value) body.effort = effortEl.value; if (pendingImage) body.image = pendingImage;
    if (currentProjectId) body.projectId = currentProjectId; // target the viewed project explicitly
    var useNew = pendingNew || !lastSessionId; var path = useNew ? '/api/sessions' : '/api/sessions/current/messages';
    addMsg('user', text || '(image)', pendingImage);
    api(path, { method: 'POST', body: JSON.stringify(body) }).then(function (r) {
      if (r.status === 409) { addSys('this project already has a turn running — it can run alongside your other projects, just not two at once', 'banner'); return; }
      promptEl.value = ''; autogrow(); setImage(null); pendingNew = false;
      return r.json().then(function (j) { if (j.sessionId) lastSessionId = j.sessionId; }).catch(function () {});
    }).catch(function () {});
  }
  sendBtn.addEventListener('click', send);
  promptEl.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  $('switchBtn').addEventListener('click', function () { var b = currentProjectId ? { projectId: currentProjectId } : {}; api('/api/switch', { method: 'POST', body: JSON.stringify(b) }).then(function (r) { if (r.status === 409) addSys('no turn running in this project', 'banner'); }).catch(function () {}); });
})();
</script>
</body>
</html>
